[project]
name = "medwhisper"
version = "0.1.0"
description = "BLS training video speech analysis and call evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.0.1",
    "ffmpeg-python==0.2.0",
    "google-genai>=2.18.1,<3",
    "jaconv==0.5.0",
    "japanize-matplotlib==1.1.3",
    "librosa==0.10.2.post1",
    "matplotlib==3.9.4",
    "moviepy==1.0.3",
    "numpy==1.26.4",
    "openai-whisper==20250625",
    "pandas==2.2.3",
    "pyannote.audio==3.3.0",
    "pydub==0.25.1",
    "pykakasi==2.3.0",
    "pyloudnorm==0.1.1",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "soundfile==0.13.1",
    "torch==2.4.1",
    "torchaudio==2.4.1",
    "torchvision==0.19.1",
    "transformers==4.46.3",
    "webrtcvad-wheels==2.0.14",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5,<7",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.3,<5",
]
archive = [
    "bitsandbytes>=0.45,<1",
    "demucs>=4.0.1,<5",
    "jiwer>=3,<5",
    "noisereduce>=3,<4",
    "peft==0.13.2",
    "speechrecognition>=3.10,<4",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[project]
name = "medwhisper"
version = "0.1.0"
description = "BLS training video speech analysis and call evaluation"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
    "accelerate==1.0.1",
    "ffmpeg-python==0.2.0",
    "jaconv==0.5.0",
    "japanize-matplotlib==1.1.3",
    "librosa==0.10.2.post1",
    "matplotlib==3.7.5",
    "moviepy==1.0.3",
    "numpy==1.24.4",
    "openai-whisper==20250625",
    "pandas==2.0.3",
    "pyannote.audio==3.3.0",
    "pydub==0.25.1",
    "pykakasi==2.3.0",
    "pyloudnorm==0.1.1",
    "scikit-learn==1.3.2",
    "scipy==1.10.1",
    "soundfile==0.13.1",
    "torch==2.4.1",
    "torchaudio==2.4.1",
    "torchvision==0.19.1",
    "transformers==4.46.3",
    "webrtcvad==2.0.10",
]

[dependency-groups]
dev = [
    "ipykernel==6.29.5",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
